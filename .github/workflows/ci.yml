name: CI

# Roda em todo pull request e é reutilizado por deploy.yml antes de publicar
# qualquer imagem. Nada chega em homologação ou produção sem passar por aqui.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.0"

jobs:
  migrations:
    name: Migrações não destrutivas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./infra/scripts/check-migrations.sh

  quality:
    name: Formato, lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # contracts é dependência de api e web; precisa existir antes do resto.
      - run: pnpm --filter @cge/contracts build

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Playwright ponta a ponta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # e2e.sh sobe postgres e minio pelo compose, cria o banco intranet_cge_e2e,
      # migra, provisiona o admin e semeia homologação antes do Playwright.
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
