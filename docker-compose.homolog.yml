# Homologação (dev) — roda ao lado da produção na mesma máquina.
#
# Isolamento vem de três lugares: o nome do projeto (`name:` abaixo) separa
# volumes e rede, a tag da imagem separa o que cada ambiente recebe, e o escopo
# do Watchtower impede que uma atualização de homologação toque em produção.
#
#   docker compose --env-file .env.homolog -f docker-compose.homolog.yml up -d
name: intranet-homolog

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-ghcr.io/intranet-cge-am/intranet-cge-api}:${IMAGE_TAG:-homolog}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.scope: homolog
    environment:
      # Homologação aplica migrações sozinha; produção nunca faz isso.
      RUN_MIGRATIONS: "true"
      # Acesso por IP e porta, sem TLS. O cookie de sessão não pode exigir
      # HTTPS aqui ou o login não completa. Produção mantém true.
      SECURE_COOKIES: "false"
      # development libera `homolog:seed` e dispensa MIGRATION_CONFIRM.
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      WEB_ORIGIN: ${WEB_ORIGIN}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-intranet-cge}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: ${WEB_IMAGE:-ghcr.io/intranet-cge-am/intranet-cge-web}:${IMAGE_TAG:-homolog}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.scope: homolog
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Observa o GHCR e reaplica a tag de homologação quando o digest muda.
  # O escopo garante que ele só enxerga api e web deste projeto: postgres e
  # minio não têm o rótulo e nunca são reiniciados por ele.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_FILE:-/home/thalison/.docker/config.json}:/config.json:ro
    environment:
      WATCHTOWER_SCOPE: homolog
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-120}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      TZ: ${TZ:-America/Manaus}

volumes:
  postgres-data:
  minio-data:
