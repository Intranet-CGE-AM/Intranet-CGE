# Produção — convive com o projeto de homologação na mesma máquina.
#
#   docker compose --env-file .env.production -f docker-compose.production.yml up -d
name: intranet-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-client:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [tools]
    entrypoint: ["/bin/sh", "-c"]
    environment:
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-intranet-cge}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backup
    depends_on:
      minio:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-ghcr.io/intranet-cge-am/intranet-cge-api}:${IMAGE_TAG:-production}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.scope: production
    environment:
      NODE_ENV: production
      # Produção nunca migra ao subir. Para avançar o schema, rode a migração
      # como comando avulso com RUN_MIGRATIONS=true e MIGRATION_CONFIRM.
      RUN_MIGRATIONS: "false"
      SECURE_COOKIES: "true"
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      WEB_ORIGIN: ${WEB_ORIGIN}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-intranet-cge}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Termina o TLS na frente do web. Os cookies de sessão são `Secure`, então
  # sem HTTPS o navegador nunca devolve a sessão e o login não completa.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${TLS_BIND_ADDRESS:-0.0.0.0}:${TLS_PORT:-443}:443"
    environment:
      TLS_SITE_HOST: ${TLS_SITE_HOST:-10.0.0.9}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Preserva a CA e os certificados entre reinícios: sem isto o Caddy gera
      # uma raiz nova a cada subida e as estações voltam a ver aviso.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/intranet-cge-am/intranet-cge-web}:${IMAGE_TAG:-production}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.scope: production
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Só enxerga containers com o rótulo de escopo `production`. A tag de
  # produção só muda quando a promoção reaponta o digest já homologado.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_FILE:-/home/thalison/.docker/config.json}:/config.json:ro
    environment:
      WATCHTOWER_SCOPE: production
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      TZ: ${TZ:-America/Manaus}

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
